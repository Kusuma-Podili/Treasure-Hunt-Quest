[tool.poetry]
name = "treasure-hunt-quest"
version = "1.0.0"
description = "Procedural 2D & 2.5D Isometric Dungeon Exploration & Puzzle Game with 50k+ LOC"
authors = ["Kusuma Podili <kusumapodili@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Kusuma-Podili/Treasure-Hunt-Quest"
repository = "https://github.com/Kusuma-Podili/Treasure-Hunt-Quest"

[tool.poetry.scripts]
treasure-hunt = "main:main"

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
